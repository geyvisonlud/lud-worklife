name: Send reminders
# Push notifications for events, task time blocks and the morning digest. Uses the same repository secrets
# as the sync workflow: APP_URL (https://your-app.vercel.app) and CRON_SECRET.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/notify
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL secret not set — skipping"; exit 0; fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/notify"
